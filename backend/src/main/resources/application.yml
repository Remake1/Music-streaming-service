spring:
  data:
    mongodb:
      uri: ${DB_URL:mongodb://127.0.0.1:27017/muz-dev}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${PORT:3000}

jwt:
  secret: ${JWT_SECRET:changeme-use-a-long-random-secret-in-production}
  expiration-ms: 86400000

springdoc:
  swagger-ui:
    path: /doc
  api-docs:
    path: /api-docs

storage:
  s3:
    bucket: ${S3_BUCKET:muz-media}
    region: ${S3_REGION:us-east-1}
    endpoint: ${S3_ENDPOINT:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}

logging:
  level:
    com.muz: INFO
